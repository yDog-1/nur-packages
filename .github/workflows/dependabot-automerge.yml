name: Merge bot updates

on:
  workflow_run:
    workflows: [Build and cache]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.pull_requests[0].number != null
    runs-on: ubuntu-latest
    steps:
      # Do not check out or run code supplied by the pull request.
      - name: Verify and merge bot update
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          BUILT_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_ACTOR: ${{ github.event.workflow_run.actor.login }}
        run: |
          set -euo pipefail

          pr="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER")"
          author="$(jq -r '.user.login' <<< "$pr")"
          author_type="$(jq -r '.user.type' <<< "$pr")"
          head_repo="$(jq -r '.head.repo.full_name' <<< "$pr")"
          head_ref="$(jq -r '.head.ref' <<< "$pr")"
          head_sha="$(jq -r '.head.sha' <<< "$pr")"

          if [[ "$RUN_ACTOR" != "$author" || "$head_sha" != "$BUILT_SHA" ]]; then
            echo "The successful build does not match the current PR head." >&2
            exit 1
          fi

          if [[ "$author" == 'dependabot[bot]' ]]; then
            :
          elif [[ "$author_type" == 'Bot' && "$head_repo" == "$REPOSITORY" && "$head_ref" == update/* ]]; then
            :
          else
            echo "PR is not an eligible bot update." >&2
            exit 1
          fi

          gh pr merge "$PR_NUMBER" --repo "$REPOSITORY" --squash --match-head-commit "$BUILT_SHA"
