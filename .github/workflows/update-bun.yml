name: Update Bun packages

on:
  workflow_call:
    inputs:
      package:
        description: Flake package exposing passthru.bun2nixUpdate
        required: true
        type: string
    secrets:
      CACHIX_AUTH_TOKEN:
        required: false
      CI_APP_PRIVATE_KEY:
        required: true

jobs:
  update:
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ steps.app-token.outputs.token }}

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: ydog-1-nur
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Update package source
        env:
          PACKAGE: ${{ inputs.package }}
        run: nix develop --command nix-update --flake --src-only --override-filename "pkgs/$PACKAGE/default.nix" "$PACKAGE"

      - name: Regenerate Bun dependencies
        shell: bash
        env:
          PACKAGE: ${{ inputs.package }}
        run: |
          set -euo pipefail

          config="$(nix eval --json ".#$PACKAGE.bun2nixUpdate")"
          source_root="$(jq -er '.sourceRoot | select(type == "string" and length > 0)' <<< "$config")"
          source_lock_file="$(jq -er '.sourceLockFile | select(type == "string" and length > 0)' <<< "$config")"
          lock_file="$(jq -er '.lockFile | select(type == "string" and length > 0)' <<< "$config")"
          nix_file="$(jq -er '.nixFile | select(type == "string" and length > 0)' <<< "$config")"
          source="$(nix build --no-link --print-out-paths ".#$PACKAGE.src")"

          for path in "$source_root" "$source_lock_file" "$lock_file" "$nix_file"; do
            if [[ "$path" == /* || "$path" == *//* || "/$path/" == */../* ]]; then
              echo "Invalid relative path in bun2nixUpdate: $path" >&2
              exit 1
            fi
          done

          source_dir="$source/$source_root"
          test -f "$source_dir/package.json"
          test -f "$source_dir/$source_lock_file"

          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir"' EXIT
          cp -R --no-preserve=mode "$source_dir/." "$temp_dir"
          nix develop --command bun install --cwd "$temp_dir" --frozen-lockfile --ignore-scripts --no-progress

          install -Dm644 "$source_dir/$source_lock_file" "$lock_file"
          nix develop --command bun2nix -l "$lock_file" -o "$nix_file"
          nix develop --command deadnix --edit "$nix_file"
          nix fmt "$nix_file"

      - name: Build package
        env:
          PACKAGE: ${{ inputs.package }}
        run: nix build ".#$PACKAGE" --print-build-logs

      - name: Check flake
        run: nix flake check

      - id: create-pull-request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          commit-message: "update bun package ${{ inputs.package }}"
          title: "update bun package ${{ inputs.package }}"
          body: "Automated update of Bun package `${{ inputs.package }}` and its generated dependency files."
          branch: "update/bun-${{ inputs.package }}"
          delete-branch: true
