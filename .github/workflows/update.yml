name: Update packages

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  update-ai-usagebar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get latest ai-usagebar version
        id: latest
        run: |
          version="$(curl -fsSL -A "yDog-1/nur-packages update workflow" "https://crates.io/api/v1/crates/ai-usagebar" | jq -r '.crate.max_stable_version // .crate.max_version')"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Update ai-usagebar
        run: nix run nixpkgs#nix-update -- --flake --version "${{ steps.latest.outputs.version }}" ai-usagebar

      - name: Build ai-usagebar
        run: nix build .#ai-usagebar

      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: "update ai-usagebar"
          title: "update ai-usagebar"
          body: "Automated ai-usagebar update."
          branch: "update/ai-usagebar"
